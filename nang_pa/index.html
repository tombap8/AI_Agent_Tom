<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉파먹먹 - 실시간 AI 인공지능 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-6 text-slate-800">

    <header class="max-w-[1600px] mx-auto mb-6 flex flex-col sm:flex-row items-center justify-between bg-white/80 backdrop-blur-md px-6 py-4 rounded-2xl shadow-xs border border-white/50">
        <div class="flex items-center space-x-3 mb-3 sm:mb-0">
            <div class="bg-gradient-to-tr from-emerald-500 to-teal-400 p-2.5 rounded-xl shadow-md text-white">
                <i class="fa-solid fa-robot text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                    냉파먹먹 <span class="text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-full font-bold">REAL-AI ON BROWSER</span>
                </h1>
                <p class="text-xs text-slate-500 font-medium">서버 없이 웹 브라우저에서 직접 구동되는 온디바이스(On-Device) AI 냉장고</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-6 text-sm">
            <div class="text-center bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">
                <span class="text-xs text-slate-400 block mb-0.5">보유 식재료</span>
                <span class="font-bold text-slate-700"><span id="summary-total" class="text-emerald-500">2</span>개</span>
            </div>
            <div class="text-center bg-rose-50 px-4 py-2 rounded-xl border border-rose-100/50">
                <span class="text-xs text-rose-400 block mb-0.5">소비 임박 (3일 내)</span>
                <span class="font-bold text-rose-600"><span id="summary-urgent" class="animate-pulse">1</span>개</span>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <section class="lg:col-span-3 bg-white/90 backdrop-blur-xs p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[760px]">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <h2 class="font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-box-archive text-indigo-500"></i> 나의 냉장고 재료
                </h2>
            </div>

            <div id="urgent-banner" class="bg-gradient-to-r from-amber-50 to-orange-50 border-l-4 border-amber-500 p-3 rounded-r-xl mb-4 text-xs shadow-xs">
                <p class="font-bold text-amber-900 mb-0.5"><i class="fa-solid fa-triangle-exclamation mr-1 animate-bounce"></i>소비 임박 알림</p>
                <p class="text-slate-600">유통기한이 얼마 남지 않은 재료를 먼저 요리해 보세요.</p>
            </div>

            <div id="ingredient-list-box" class="flex-1 overflow-y-auto pr-1 custom-scroll space-y-2.5">
                </div>
        </section>


        <section class="lg:col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[760px] justify-between">
            <div>
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h2 class="font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-brain text-emerald-500"></i> 브라우저 자체 머신러닝 스캔
                    </h2>
                </div>

                <div class="relative bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden min-h-[350px] flex items-center justify-center mb-5 shadow-inner">
                    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="processRealAI(event)">
                    
                    <label id="drop-zone" for="image-input" class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-800/50 transition-all z-10 p-6 text-center text-slate-400">
                        <div class="w-14 h-14 rounded-full bg-slate-800 text-emerald-400 flex items-center justify-center mb-3 border border-slate-700 shadow-lg">
                            <i class="fa-solid fa-camera text-xl"></i>
                        </div>
                        <span class="text-slate-200 font-semibold text-sm">실제 사진 업로드 테스트</span>
                        <span class="text-xs text-slate-500 mt-1">사과, 바나나, 오렌지, 당근, 브로콜리, 병, 컵 사진을 올려보세요!</span>
                    </label>

                    <div id="preview-container" class="hidden w-full h-full relative flex items-center justify-center">
                        <img id="image-preview" class="w-full h-[350px] object-contain" src="" alt="미리보기" crossorigin="anonymous">
                        
                        <div id="box-overlay" class="absolute inset-0 pointer-events-none"></div>

                        <div id="ai-loader" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center text-white hidden z-30">
                            <div class="w-10 h-10 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mb-3"></div>
                            <p id="loader-text" class="text-xs font-medium text-slate-300">TensorFlow 모델 엔진 로드 중 (최초 1회만 소요)...</p>
                        </div>

                        <button onclick="resetScan()" class="absolute top-3 right-3 bg-slate-800/90 hover:bg-rose-600 text-white text-xs font-semibold px-2.5 py-1.5 rounded-lg transition shadow-md flex items-center gap-1 cursor-pointer z-40">
                            <i class="fa-solid fa-trash-can"></i> 리셋
                        </button>
                    </div>
                </div>

                <div class="bg-slate-50 border border-slate-200/60 p-4 rounded-xl">
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-bold text-slate-600 flex items-center gap-1">
                            <i class="fa-solid fa-sliders text-slate-500"></i> 식재료 인식 결과 보정 (추가/삭제)
                        </label>
                        <span id="analysis-status" class="text-[11px] text-indigo-600 font-bold">인공지능 대기 중</span>
                    </div>
                    
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="manual-input" placeholder="AI가 놓친 재료 입력 (예: 김치, 두부)" class="flex-1 bg-white px-3 py-2 border border-slate-200 rounded-lg text-xs font-medium focus:outline-emerald-500">
                        <button onclick="addManualTag()" class="bg-slate-800 hover:bg-slate-950 text-white text-xs font-bold px-4 py-2 rounded-lg transition cursor-pointer">추가</button>
                    </div>

                    <div id="detected-tags-container" class="flex flex-wrap gap-1.5 min-h-[85px] p-2.5 bg-white rounded-lg border border-slate-100 items-start">
                        <p id="empty-tag-msg" class="text-slate-400 text-xs m-auto text-center py-6 w-full">진짜 인공지능이 탐지해 낸 식재료 태그가 여기에 표시됩니다.</p>
                    </div>
                </div>
            </div>

            <button id="save-to-fridge-btn" disabled onclick="saveIngredientsToFridge()" class="w-full bg-slate-200 text-slate-400 font-bold py-3.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> 보정 완료된 재료 냉장고에 넣기
            </button>
        </section>


        <section class="lg:col-span-4 bg-white/90 backdrop-blur-xs p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[760px]">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                <h2 class="font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-utensils text-amber-500"></i> 실시간 추천 레시피
                </h2>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-4 bg-slate-50 p-2 rounded-xl text-xs">
                <select id="filter-type" onchange="renderRecipes()" class="bg-white border border-slate-200 rounded-md p-1 font-medium">
                    <option value="전체">종류 (전체)</option>
                    <option value="디저트/과일">디저트/과일</option>
                    <option value="반찬/요리">반찬/요리</option>
                </select>
                <select id="filter-time" onchange="renderRecipes()" class="bg-white border border-slate-200 rounded-md p-1 font-medium">
                    <option value="전체">시간 (전체)</option>
                    <option value="10">10분 이내</option>
                    <option value="30">30분 이내</option>
                </select>
            </div>

            <div id="recipe-list-box" class="flex-1 overflow-y-auto pr-1 custom-scroll space-y-4">
                </div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl opacity-0 transition-all duration-300 pointer-events-none z-50 text-xs font-semibold border border-slate-800">
        <span id="toast-text">알림 내용</span>
    </div>

    <script>
        // 1. 기본 냉장고 보관 식재료 상태 관리
        let myIngredients = [
            { id: 1, name: '우유', expiryDays: 2 },
            { id: 2, name: '빵', expiryDays: 7 }
        ];

        let detectedTags = [];
        let model = null; // 텐서플로우 모델 저장 변수

        // COCO-SSD 영어 탐지명을 한국어 시스템 이름으로 연결해 주는 전처리 매퍼 딕셔너리
        const translationMap = {
            'apple': '사과',
            'banana': '바나나',
            'orange': '오렌지',
            'carrot': '당근',
            'broccoli': '브로콜리',
            'bottle': '음료수병',
            'cup': '컵/머그잔',
            'sandwich': '샌드위치'
        };

        // 2. 인공지능이 맞출 식재료 기반의 고정 레시피 북 데이터베이스
        const recipeMaster = [
            {
                name: '달콤 상큼 과일 샐러드',
                type: '디저트/과일',
                time: 5,
                required: ['사과', '바나나', '오렌지'],
                image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400&auto=format&fit=crop&q=80'
            },
            {
                name: '영양만점 야채 당근 볶음',
                type: '반찬/요리',
                time: 15,
                required: ['당근', '브로콜리', '양파'],
                image: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400&auto=format&fit=crop&q=80'
            },
            {
                name: '바나나 토스트 샌드위치',
                type: '디저트/과일',
                time: 10,
                required: ['바나나', '빵', '우유'],
                image: 'https://images.unsplash.com/photo-1541532713592-79a0317b6b77?w=400&auto=format&fit=crop&q=80'
            }
        ];

        window.onload = function() {
            updateDashboard();
            renderRecipes();
            // 백그라운드에서 AI 엔진 미리 예열 로드 시작
            loadAIModel();
        };

        // 진짜 TensorFlow 모델 다운로드 및 연동 비동기 함수
        async function loadAIModel() {
            if (!model) {
                try {
                    model = await cocoSsd.load();
                    document.getElementById('analysis-status').innerText = "⚡ AI 엔진 탑재 완료";
                } catch (e) {
                    console.error("AI 로드 실패", e);
                }
            }
        }

        // --- ① 이미지 업로드 발생 시 진짜 AI 탐지 코어 엔진 ---
        async function processRealAI(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('drop-zone').classList.add('hidden');
                document.getElementById('preview-container').classList.remove('hidden');
                
                const img = document.getElementById('image-preview');
                img.src = e.target.result;
                
                const loader = document.getElementById('ai-loader');
                loader.classList.remove('hidden');
                document.getElementById('analysis-status').innerText = "🧠 인공지능 인식 중...";

                img.onload = async function() {
                    // 모델이 로드 안 되었다면 마저 로드 완료 대기
                    if (!model) {
                        document.getElementById('loader-text').innerText = "구글 인공지능 코어 데이터 다운로드 중...";
                        await loadAIModel();
                    }

                    document.getElementById('loader-text').innerText = "사진 픽셀 스캔 및 사물 특징점 추론 중...";
                    
                    // 💥 진짜 인공지능 추론 (식재료 찾기) 명령어
                    const predictions = await model.detect(img);
                    
                    loader.classList.add('hidden');
                    drawBoundingBoxes(predictions, img);
                };
            };
            reader.readAsDataURL(file);
        }

        // 인공지능이 찾아낸 좌표값(Predictions)을 바탕으로 이미지 위에 실제 박스 오버레이 그리기
        function drawBoundingBoxes(predictions, img) {
            const overlay = document.getElementById('box-overlay');
            overlay.innerHTML = ''; // 기존 박스 제거
            detectedTags = [];

            // 이미지의 실제 출력 스케일 대비 비율 구하기
            const displayWidth = img.clientWidth;
            const displayHeight = img.clientHeight;
            const naturalWidth = img.naturalWidth;
            const naturalHeight = img.naturalHeight;

            const scaleX = displayWidth / naturalWidth;
            const scaleY = displayHeight / naturalHeight;

            // 이미지가 화면 정중앙에 배치되므로 발생하는 여백(Offset) 계산 보정
            const rect = img.getBoundingClientRect();
            const parentRect = img.parentElement.getBoundingClientRect();
            const offsetX = rect.left - parentRect.left;
            const offsetY = rect.top - parentRect.top;

            let validCount = 0;

            predictions.forEach(pred => {
                // 탐지 신뢰도가 40% 이상인 것만 유효 데이터로 채택
                if (pred.score > 0.4) {
                    validCount++;
                    const [x, y, width, height] = pred.bbox;

                    // 화면 크기에 맞게 좌표 연산 변환
                    const boxX = x * scaleX + offsetX;
                    const boxY = y * scaleY + offsetY;
                    const boxW = width * scaleX;
                    const boxH = height * scaleY;

                    // 영어 사물명을 한글 식재료명으로 전환 (사전에 없는 물체는 그냥 출력)
                    const krName = translationMap[pred.class] || pred.class;
                    
                    if (!detectedTags.includes(krName)) {
                        detectedTags.push(krName);
                    }

                    // HTML 상에 박스 오버레이 동적 레이어 추가
                    const boxEl = document.createElement('div');
                    boxEl.style.position = 'absolute';
                    boxEl.style.left = `${boxX}px`;
                    boxEl.style.top = `${boxY}px`;
                    boxEl.style.width = `${boxW}px`;
                    boxEl.style.height = `${boxH}px`;
                    boxEl.style.border = '2px solid #34d399';
                    boxEl.style.backgroundColor = 'rgba(52, 211, 153, 0.15)';
                    boxEl.style.borderRadius = '4px';
                    boxEl.style.zIndex = '10';

                    const labelEl = document.createElement('span');
                    labelEl.innerText = `${krName} (${Math.round(pred.score * 100)}%)`;
                    labelEl.style.position = 'absolute';
                    labelEl.style.top = '-18px';
                    labelEl.style.left = '-2px';
                    labelEl.style.backgroundColor = '#10b981';
                    labelEl.style.color = '#fff';
                    labelEl.style.fontSize = '9px';
                    labelEl.style.fontWeight = 'bold';
                    labelEl.style.padding = '1px 4px';
                    labelEl.style.borderRadius = '3px';
                    labelEl.style.whiteSpace = 'nowrap';

                    boxEl.appendChild(labelEl);
                    overlay.appendChild(boxEl);
                }
            });

            document.getElementById('analysis-status').innerText = `✅ AI 물체 ${validCount}건 분석 완료`;
            showToast('온디바이스 머신러닝 분석이 완료되었습니다.');
            renderTags();
        }

        // 이미지 리셋 기능
        function resetScan() {
            detectedTags = [];
            document.getElementById('drop-zone').classList.remove('hidden');
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('image-input').value = '';
            document.getElementById('box-overlay').innerHTML = '';
            document.getElementById('analysis-status').innerText = "⚡ AI 엔진 상시 대기 중";
            renderTags();
        }

        // --- ② 태그 및 냉장고 수납 보정 기능 ---
        function renderTags() {
            const container = document.getElementById('detected-tags-container');
            const saveBtn = document.getElementById('save-to-fridge-btn');
            
            const msg = document.getElementById('empty-tag-msg');
            if(msg) msg.remove();

            container.innerHTML = '';

            if(detectedTags.length === 0) {
                container.innerHTML = `<p id="empty-tag-msg" class="text-slate-400 text-xs m-auto text-center py-6 w-full">사진 속 사물을 인지하지 못했거나 비어있습니다.</p>`;
                saveBtn.disabled = true;
                saveBtn.className = "w-full bg-slate-200 text-slate-400 font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 cursor-not-allowed";
                return;
            }

            detectedTags.forEach((tag, idx) => {
                const chip = document.createElement('div');
                chip.className = "bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center space-x-1 border border-indigo-200 shadow-2xs";
                chip.innerHTML = `
                    <span>${tag}</span>
                    <button onclick="removeTag(${idx})" class="hover:text-rose-600 font-bold ml-0.5 cursor-pointer">×</button>
                `;
                container.appendChild(chip);
            });

            saveBtn.disabled = false;
            saveBtn.className = "w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 rounded-xl shadow-md cursor-pointer transition transform active:scale-[0.99] text-sm flex items-center justify-center gap-2";
        }

        function addManualTag() {
            const input = document.getElementById('manual-input');
            const value = input.value.trim();
            if(!value) return;

            if(detectedTags.includes(value)) return;
            detectedTags.push(value);
            input.value = '';
            renderTags();
        }

        function removeTag(index) {
            detectedTags.splice(index, 1);
            renderTags();
        }

        function saveIngredientsToFridge() {
            if(detectedTags.length === 0) return;

            detectedTags.forEach(name => {
                const randomExpiry = Math.floor(Math.random() * 9) + 3; 
                myIngredients.unshift({
                    id: Date.now() + Math.random(),
                    name: name,
                    expiryDays: randomExpiry
                });
            });

            showToast('실제 AI 인식 재료들이 나의 냉장고 대시보드에 보관되었습니다.');
            resetScan();
            updateDashboard();
            renderRecipes();
        }

        // --- ③ 냉장고 현황 UI 및 통계 렌더링 ---
        function updateDashboard() {
            const container = document.getElementById('ingredient-list-box');
            container.innerHTML = '';
            let urgentCount = 0;

            myIngredients.forEach(item => {
                let badgeClass = 'bg-slate-100 text-slate-600';
                let cardBorder = 'border-slate-100';
                
                if (item.expiryDays <= 3) {
                    badgeClass = 'bg-rose-50 text-rose-600 font-bold border border-rose-100';
                    cardBorder = 'border-rose-100 bg-rose-50/10';
                    urgentCount++;
                }

                const card = document.createElement('div');
                card.className = `bg-white p-3.5 rounded-xl border ${cardBorder} flex items-center justify-between shadow-2xs group hover:border-slate-300 transition-colors`;
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-lg bg-slate-50 flex items-center justify-center font-bold text-slate-600 border border-slate-100 text-sm">
                            ${item.name[0]}
                        </div>
                        <div>
                            <h4 class="font-semibold text-slate-800 text-xs">${item.name}</h4>
                            <span class="text-[11px] text-slate-400 block">D-${item.expiryDays}일 남음</span>
                        </div>
                    </div>
                    <button onclick="deleteIngredient(${item.id})" class="text-slate-300 hover:text-rose-500 text-xs p-1 opacity-0 group-hover:opacity-100 transition-all cursor-pointer">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                `;
                container.appendChild(card);
            });

            document.getElementById('summary-total').innerText = myIngredients.length;
            document.getElementById('summary-urgent').innerText = urgentCount;
            document.getElementById('urgent-banner').classList.toggle('hidden', urgentCount === 0);
        }

        function deleteIngredient(id) {
            myIngredients = myIngredients.filter(item => item.id !== id);
            updateDashboard();
            renderRecipes();
        }

        // --- ④ 지능형 동적 레시피 연동 추천 엔진 ---
        function renderRecipes() {
            const container = document.getElementById('recipe-list-box');
            container.innerHTML = '';

            const myIngreNames = myIngredients.map(item => item.name);
            const typeFilter = document.getElementById('filter-type').value;
            const timeFilter = document.getElementById('filter-time').value;

            let scoredRecipes = recipeMaster.map(recipe => {
                const owned = recipe.required.filter(req => myIngreNames.includes(req));
                const missing = recipe.required.filter(req => !myIngreNames.includes(req));
                const matchRate = (owned.length / recipe.required.length) * 100;
                return { ...recipe, owned, missing, matchRate };
            });

            // 매칭 점수 높은 순 정렬
            scoredRecipes.sort((a, b) => b.matchRate - a.matchRate);

            if(typeFilter !== '전체') scoredRecipes = scoredRecipes.filter(r => r.type === typeFilter);
            if(timeFilter !== '전체') scoredRecipes = scoredRecipes.filter(r => r.time <= parseInt(timeFilter));

            scoredRecipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-xl overflow-hidden shadow-2xs flex group";
                
                let missingBadges = recipe.missing.map(m => `<span class="bg-rose-50 text-rose-600 text-[10px] font-semibold px-2 py-0.5 rounded mr-1 border border-rose-100">#${m}</span>`).join('');
                if(recipe.missing.length === 0) missingBadges = `<span class="text-emerald-600 text-[10px] font-bold"><i class="fa-solid fa-circle-check"></i> 모든 재료 보유 중!</span>`;

                let rateBadgeColor = 'bg-slate-900 text-white';
                if(recipe.matchRate >= 60) rateBadgeColor = 'bg-emerald-500 text-white';

                card.innerHTML = `
                    <div class="w-24 h-24 sm:w-28 sm:h-28 relative shrink-0">
                        <img class="w-full h-full object-cover" src="${recipe.image}">
                        <span class="absolute top-1 left-1 bg-slate-900/80 text-white text-[9px] px-1.5 py-0.5 rounded font-bold">
                            ${recipe.type}
                        </span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between min-w-0">
                        <div>
                            <div class="flex items-start justify-between gap-1 mb-0.5">
                                <h3 class="font-bold text-slate-900 text-xs truncate">${recipe.name}</h3>
                                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md shrink-0 ${rateBadgeColor}">
                                    ${Math.round(recipe.matchRate)}%
                               Volume</span>
                            </div>
                            <span class="text-[10px] text-slate-400"><i class="fa-regular fa-clock"></i> ${recipe.time}분 소요</span>
                        </div>
                        <div class="text-[11px] bg-slate-50 px-2 py-1.5 rounded-lg border border-slate-100">
                            <div class="flex flex-wrap items-center">${missingBadges}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }
    </script>
</body>
</html>
