<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매력적인 고양이의 세계</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <h1>매력적인 고양이의 세계</h1>
        <div class="banner-slider">
            <div class="banner-wrapper" id="banner-wrapper">
                <!-- 배너 이미지가 JS로 삽입됩니다 -->
            </div>
            <button id="prevBtn" class="slider-btn">&lt;</button>
            <button id="nextBtn" class="slider-btn">&gt;</button>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="#general-info">고양이의 일반적 특징</a></li>
            <li><a href="#breeds-gallery">대표적인 고양이 종류</a></li>
        </ul>
    </nav>

    <main>
        <section id="general-info">
            <h2>고양이의 일반적 특징 및 키우는 방법</h2>
            <div class="general-content">
                <div class="card">
                    <h3>일반적 특징</h3>
                    <ul id="general-characteristics">
                        <!-- JS로 삽입 -->
                    </ul>
                </div>
                <div class="card">
                    <h3>키우는 방법 및 팁</h3>
                    <ul id="general-tips">
                        <!-- JS로 삽입 -->
                    </ul>
                </div>
            </div>
        </section>

        <section id="breeds-gallery">
            <h2>대표적인 고양이 7종</h2>
            <div id="breeds-container" class="grid-container">
                <!-- JS로 삽입 -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AI Agent Cat Info SPA</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
