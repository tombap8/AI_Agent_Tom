<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom's Drag & Drop To Do List</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .todo-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            position: relative; /* 상단 홈 버튼 배치를 위한 기준점 */
        }

        /* 메인 허브 이동 링크 스타일 */
        .nav-header {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 15px;
        }
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .home-link:hover {
            color: #4a90e2; /* 호버 시 포인트 컬러 전환 */
        }

        h1 {
            color: #333333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        /* 입력창 영역 */
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        #todo-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        #todo-input:focus {
            border-color: #4a90e2;
        }
        #add-btn {
            padding: 12px 20px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        #add-btn:hover {
            background-color: #357abd;
        }

        /* 안내 문구 */
        .info-text {
            font-size: 12px;
            color: #888888;
            margin-bottom: 10px;
            text-align: right;
        }

        /* 목록 영역 */
        .todo-list {
            list-style: none;
        }
        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: #fdfdfd;
            border: 1px solid #efefef;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: grab;
            transition: background-color 0.2s, opacity 0.2s;
            user-select: none;
        }
        .todo-item:active {
            cursor: grabbing;
        }
        .todo-item.dragging {
            opacity: 0.5;
            background-color: #e0f0ff;
            border: 1px dashed #4a90e2;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #aaaaaa;
        }
        .todo-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .drag-handle {
            color: #ccc;
            margin-right: 5px;
            font-weight: bold;
        }
        .todo-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .todo-text {
            font-size: 16px;
            color: #444444;
            word-break: break-all;
        }
        .delete-btn {
            background-color: transparent;
            color: #e74c3c;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .delete-btn:hover {
            background-color: #fadbd8;
        }

        /* 전체 삭제 영역 및 버튼 스타일 추가 */
        .clear-section {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            border-top: 1px solid #efefef;
            padding-top: 15px;
        }
        #clear-all-btn {
            background-color: #f2f4f7;
            color: #e74c3c;
            border: 1px solid #dcdfe6;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        #clear-all-btn:hover {
            background-color: #e74c3c;
            color: #ffffff;
            border-color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="todo-container">
    <div class="nav-header">
        <a href="./index.html" class="home-link">⇠ 메인 대시보드로 가기</a>
    </div>

    <h1>To Do List</h1>
    
    <div class="input-section">
        <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." maxlength="50">
        <button id="add-btn">추가</button>
    </div>

    <div class="info-text">💡 항목을 드래그하여 순서를 바꿀 수 있음</div>

    <ul id="todo-list" class="todo-list"></ul>

    <div id="clear-area"></div>
</div>

<script>
    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const clearArea = document.getElementById('clear-area'); // 전체 삭제 영역 타겟팅 추가

    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    renderTodos();

    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTodo();
    });

    function addTodo() {
        const taskText = todoInput.value.trim();
        if (taskText === '') {
            alert('할 일을 입력해주세요.');
            return;
        }
        const newTodo = {
            id: Date.now(),
            text: taskText,
            completed: false
        };
        todos.push(newTodo);
        saveAndRender();
        todoInput.value = '';
    }

    function saveAndRender() {
        localStorage.setItem('todos', JSON.stringify(todos));
        renderTodos();
    }

    function renderTodos() {
        todoList.innerHTML = '';
        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
            li.draggable = true;
            li.dataset.index = index;

            li.innerHTML = `
                <div class="todo-left">
                    <span class="drag-handle">☰</span>
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}>
                    <span class="todo-text">${todo.text}</span>
                </div>
                <button class="delete-btn">삭제</button>
            `;

            const checkbox = li.querySelector('.todo-checkbox');
            checkbox.addEventListener('change', () => toggleTodo(todo.id));

            const deleteBtn = li.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

            li.addEventListener('dragstart', handleDragStart);
            li.addEventListener('dragend', handleDragEnd);

            todoList.appendChild(li);
        });
        todoList.addEventListener('dragover', handleDragOver);

        // 전체 삭제 버튼 활성화 여부 제어 로직 추가
        renderClearAllButton();
    }

    // 전체 삭제 버튼 동적 렌더링 함수 추가
    function renderClearAllButton() {
        if (todos.length > 0) {
            clearArea.innerHTML = `
                <div class="clear-section">
                    <button id="clear-all-btn">전체 삭제</button>
                </div>
            `;
            const clearAllBtn = document.getElementById('clear-all-btn');
            clearAllBtn.addEventListener('click', clearAllTodos);
        } else {
            clearArea.innerHTML = ''; // 저장된 할 일이 없을 경우 공간 비움 처리
        }
    }

    // 전체 삭제 기능 실행 함수 추가
    function clearAllTodos() {
        if (confirm('등록된 모든 할 일 목록을 삭제하시겠습니까?')) {
            todos = []; // 데이터 배열 비움
            saveAndRender(); // 로컬 스토리지 데이터 동기화 및 렌더링
        }
    }

    let draggedItemIdx = null;

    function handleDragStart(e) {
        draggedItemIdx = Number(this.dataset.index);
        this.classList.add('dragging');
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
        draggedItemIdx = null;
        
        const currentItems = [...todoList.querySelectorAll('.todo-item')];
        const reorderedTodos = currentItems.map(item => {
            const originIdx = Number(item.dataset.index);
            return todos[originIdx];
        });

        todos = reorderedTodos;
        saveAndRender();
    }

    function handleDragOver(e) {
        e.preventDefault();
        const draggingItem = todoList.querySelector('.dragging');
        if (!draggingItem) return;

        const siblings = [...todoList.querySelectorAll('.todo-item:not(.dragging)')];
        const nextSibling = siblings.find(sibling => {
            const box = sibling.getBoundingClientRect();
            return e.clientY <= box.top + box.height / 2;
        });

        if (nextSibling) {
            todoList.insertBefore(draggingItem, nextSibling);
        } else {
            todoList.appendChild(draggingItem);
        }
    }

    function toggleTodo(id) {
        todos = todos.map(todo => 
            todo.id === id ? { ...todo, completed: !todo.completed } : todo
        );
        saveAndRender();
    }

    function deleteTodo(id) {
        todos = todos.filter(todo => todo.id !== id);
        saveAndRender();
    }
</script>

</body>
</html>
